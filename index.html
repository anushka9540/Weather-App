<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="stylesheet" href="./style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="main-container">
      <header class="input-container">
        <input type="text" class="city-input" placeholder="Search City" />
        <button class="search-btn">
          <i class="fa-solid fa-magnifying-glass fa-xl"></i>
        </button>
      </header>

      <div class="loader" style="display: none">
        <img src="./images/1494 (1).gif" alt="Loading..." />
      </div>

      <div class="loader" style="display: none">
        <img src="./images/ (1).gif" alt="Loading..." />
      </div>

      <div class="weather-info" style="display: none">
        <section class="location-date-container">
          <section class="location">
            <i class="fa-solid fa-location-dot fa-xl"></i>
            <h3 class="country-text"></h3>
          </section>

          <h5 class="current-date-text regular-text" id="current-date">
            Wed, 7 Feb
          </h5>
        </section>

        <section class="weather-summary-container">
          <img src="./images/img1.webp" class="weather-summary-img" />
          <div class="weather-summary-info">
            <h1 class="temp-text">°C</h1>
            <h3 class="condition-text regular-text"></h3>
          </div>
        </section>

        <section class="weather-conditions-container">
          <div class="humiwin">
            <div class="condition-item">
              <i class="fa-solid fa-droplet fa-xl"></i>
              <div class="condition-info">
                <h5 class="regular-text">Humidity</h5>
                <h5 class="humidity-value-text" style="font-weight: 400"></h5>
              </div>
            </div>

            <div class="condition-item">
              <i class="fa-solid fa-wind fa-xl"></i>
              <div class="condition-info">
                <h5 class="regular-text" style="font-weight: 400">
                  Wind Speed
                </h5>
                <h5 class="wind-value-text" style="font-weight: 400"></h5>
              </div>
            </div>
          </div>

          <div class="prefel">
            <div class="condition-item">
              <i class="fa-solid fa-arrows-down-to-line fa-xl"></i>
              <div class="condition-info">
                <h5 class="regular-text pre">Pressure</h5>
                <h5 class="pressure-value-text" style="font-weight: 400"></h5>
              </div>
            </div>

            <div class="condition-item">
              <i class="fa-solid fa-temperature-low fa-xl"></i>
              <div class="condition-info">
                <h5 class="regular-text" style="font-weight: 400">
                  Feels Like
                </h5>
                <h5 class="feels-value-text" style="font-weight: 400"></h5>
              </div>
            </div>
          </div>
        </section>

        <h4>4-Days Weather Forecast</h4>

        <div class="forecast-item-container" style="display: none">
          <div class="forecast-item">
            <h5 class="forecast-item-date regular-text"></h5>
            <img
              src="./images/thunderstorm.svg"
              alt=""
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">°C</h5>
          </div>

          <div class="forecast-item">
            <h5 class="forecast-item-date regular-text"></h5>
            <img
              src="./images/thunderstorm.svg"
              alt=""
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">°C</h5>
          </div>

          <div class="forecast-item">
            <h5 class="forecast-item-date regular-text"></h5>
            <img
              src="./images/thunderstorm.svg"
              alt=""
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">°C</h5>
          </div>

          <div class="forecast-item">
            <h5 class="forecast-item-date regular-text">Feb</h5>
            <img
              src="./images/thunderstorm.svg"
              alt=""
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">°C</h5>
          </div>
        </div>
      </div>

      <div class="search-city section-message" style="display: none">
        <img src="./images/srch.webp" alt="" />
        <div>
          <h1>Search City Weather</h1>
          <h4 class="regular-text">
            Find out the weather condition of the city
          </h4>
        </div>
      </div>

      <div class="not-found section-message" style="display: none">
        <img src="./images/notfound.webp" alt="" class="message-img" />
        <div>
          <h1>OOPs... Location not Found</h1>
          <button class="try-again">Try Again</button>
        </div>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
